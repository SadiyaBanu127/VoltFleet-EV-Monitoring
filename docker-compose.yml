services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evfleet
      POSTGRES_USER: evfleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evfleet -d evfleet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://evfleet:${POSTGRES_PASSWORD:-local-development-only}@db:5432/evfleet
      CORS_ORIGINS: http://localhost:5173
      SIMULATOR_ENABLED: "true"
      SIMULATOR_INTERVAL_SECONDS: 4
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
